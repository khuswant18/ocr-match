version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: invoice-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root 
      MYSQL_DATABASE: invoice_db 
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql 
      - ./backend/db:/docker-entrypoint-initdb.d


  postgres:
    image: 'postgres:15'
    restart: always
    volumes: 
      - data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: password
    ports: 
      - '5432:5432'
  backend:
    build: ./backend
    ports:
      - '5001:5000'
    volumes:
        - ./backend:/app
    depends_on: 
      - postgres
      - mysql
  frontend: 
    build: ./frontend
    ports: 
      - '3000:3000'
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:5001
    volumes: 
      - ./frontend/src:/app/src
    stdin_open: true
    tty: true
    depends_on: 
      - backend
volumes: 
  mysql_data: 
  data: 